name: Fábrica de Shorts

on:
  schedule:
    # De hora em hora, das 07:23 às 23:23 (Brasília). Cada execução:
    #   1) lê seus pedidos no Telegram (refazer, ajuste, vídeo extra);
    #   2) se já passou do horário do vídeo do dia (variável HORARIOS, padrão 9h) e ele ainda
    #      não foi feito, produz o vídeo e manda para o seu Telegram.
    # Quando não há nada a fazer, a execução leva uns 20 segundos.
    - cron: "23 10-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema ou história (opcional). Vazio = próxima história da lista"
        required: false
        default: ""

permissions:
  contents: write  # para guardar o histórico em dados/ e não repetir histórias

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      # Ajustes opcionais: Settings > Secrets and variables > Actions > Variables
      HORARIOS: ${{ vars.HORARIOS }}
      DURACAO_ALVO_SEG: ${{ vars.DURACAO_ALVO_SEG }}
      VOZ: ${{ vars.VOZ }}
      VELOCIDADE_VOZ: ${{ vars.VELOCIDADE_VOZ }}
      VOLUME_MUSICA: ${{ vars.VOLUME_MUSICA }}
      NOME_CANAL: ${{ vars.NOME_CANAL }}
      GEMINI_MODELO: ${{ vars.GEMINI_MODELO }}
      YT_ENVIO_AUTOMATICO: ${{ vars.YT_ENVIO_AUTOMATICO }}
      YT_PRIVACIDADE: ${{ vars.YT_PRIVACIDADE }}
      YT_HORARIO: ${{ vars.YT_HORARIO }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -q -r requirements.txt
          if [ "$YT_ENVIO_AUTOMATICO" = "sim" ]; then pip install -q -r requirements-youtube.txt; fi

      - name: Ler pedidos e ver a agenda
        id: plano
        env:
          TEMA: ${{ inputs.tema }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m fabrica planejar --forcar
          else
            python -m fabrica planejar
          fi

      - name: Instalar ffmpeg
        if: steps.plano.outputs.tarefas == 'sim'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fontconfig > /dev/null

      - name: Produzir e entregar
        if: steps.plano.outputs.tarefas == 'sim'
        run: python -m fabrica executar

      - name: Guardar o vídeo (Artifacts, por 7 dias)
        if: always() && steps.plano.outputs.tarefas == 'sim'
        uses: actions/upload-artifact@v6
        with:
          name: shorts-${{ github.run_number }}
          path: |
            saida/**/short.mp4
            saida/**/capa.jpg
            saida/**/roteiro.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Guardar histórico e fila
        if: always()
        run: |
          git config user.name "fabrica-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Fábrica: histórico atualizado"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
